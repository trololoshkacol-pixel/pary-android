name: Site quality

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - ".github/scripts/check_site.py"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "favicon.svg"
      - ".github/scripts/check_site.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate landing page
        run: python .github/scripts/check_site.py

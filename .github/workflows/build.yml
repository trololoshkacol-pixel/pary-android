name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pary-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Configure release signing
        id: signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.PARY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PARY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PARY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PARY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/pary-release.jks
            {
              echo "PARY_STORE_FILE=app/pary-release.jks"
              echo "PARY_STORE_PASSWORD=$STORE_PASSWORD"
              echo "PARY_KEY_ALIAS=$KEY_ALIAS"
              echo "PARY_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; only the installable debug APK will be published."
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --console=plain

      - name: Build APKs
        run: gradle assembleDebug assembleRelease --no-daemon --console=plain

      - name: Verify release APK signature
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Prepare distributable APKs
        if: success()
        env:
          RELEASE_SIGNED: ${{ steps.signing.outputs.configured }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          if [ "$RELEASE_SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/*.apk dist/
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pary-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: pary-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pary v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
